<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Southern Trash Halloween Bash RSVP</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#140a1f;color:#fff}
.w{max-width:520px;margin:auto;padding:24px}
h1{color:#ff8a1f;text-align:center;margin:.2em 0}h2{color:#3dff6e;text-align:center;margin:0 0 .5em}
.info{background:#2a1540;border:2px solid #ff3fd1;border-radius:12px;padding:12px;text-align:center;margin-bottom:18px}
label{display:block;margin:12px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border-radius:8px;border:0;font-size:16px;box-sizing:border-box}
button{margin-top:18px;width:100%;padding:14px;background:#ff8a1f;border:0;border-radius:10px;font-size:18px;font-weight:700}
.g{display:none}.closed{text-align:center;font-size:20px;color:#ff8a1f}
</style></head><body><div class="w">
<h1>Southern Trash</h1><h2>Halloween Bash RSVP</h2>
<div class="info"><b>Saturday, Oct 24 &middot; 7:30 PM</b><br>2017 Marisol Ct, Biloxi<br><b>Costumes required</b><br><small>RSVP by Oct 17 &middot; up to 4 per RSVP</small></div>
<div id="closed" class="closed" style="display:none">RSVPs are closed. See you there!</div>
<form id="f" action="https://formsubmit.co/heatherinkol@gmail.com" method="POST">
<input type="hidden" name="_subject" value="New RSVP: Southern Trash Halloween Bash">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">
<input type="text" name="_honey" style="display:none">
<label>Your name</label><input name="Name" required>
<label>Phone</label><input name="Phone" type="tel" required>
<label>Email</label><input name="email" type="email">
<label>How many in your party (including you)?</label>
<select name="Party size" id="n" required><option>1</option><option>2</option><option>3</option><option>4</option></select>
<div class="g" id="g2"><label>Guest 2 name</label><input name="Guest 2"></div>
<div class="g" id="g3"><label>Guest 3 name</label><input name="Guest 3"></div>
<div class="g" id="g4"><label>Guest 4 name</label><input name="Guest 4"></div>
<button type="submit" id="b">RSVP</button><p id="msg" style="text-align:center;font-size:18px"></p></form><div id="ok" class="closed" style="display:none">You're in! See you Oct 24 &#127875;</div></div>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('msg');b.disabled=true;b.textContent='Sending...';m.textContent='';
const d=Object.fromEntries(new FormData(e.target));delete d._honey;
try{const r=await fetch('https://formsubmit.co/ajax/heatherinkol@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(d)});const j=await r.json().catch(()=>({}));
if(r.ok&&String(j.success)!=='false'){e.target.style.display='none';document.getElementById('ok').style.display='block'}else throw new Error(j.message||r.status)}
catch(err){m.textContent='Something went wrong. Please try again in a minute.';b.disabled=false;b.textContent='RSVP'}});

const n=document.getElementById('n');n.onchange=()=>{for(let i=2;i<=4;i++)document.getElementById('g'+i).style.display=i<=+n.value?'block':'none'};
if(new Date()>new Date('2026-10-18T00:00:00-05:00')){document.getElementById('f').style.display='none';document.getElementById('closed').style.display='block'}
</script></body></html>
